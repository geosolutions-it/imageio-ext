name: Build and Test

on:
  push:
    branches:
      - '**/*'
  pull_request:
    branches:
      - '**/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # No distribution ships the GDAL Java bindings any more, so they are built here.
  # 3.12 is the first version with the boolean, datetime and geometry raster attribute
  # table field types that RasterAttributeTableTest checks, and it matches the Windows job.
  GDAL_VERSION: 3.12.0
  # Runtime libraries the build links against, needed again when the tests run
  GDAL_APT_PACKAGES: libproj-dev libsqlite3-dev libtiff-dev libcurl4-openssl-dev libexpat1-dev libhdf4-alt-dev

jobs:
  gdal:
    runs-on: ubuntu-latest

    outputs:
      cache-key: ${{ steps.key.outputs.value }}

    steps:
    - name: Work out the cache key
      id: key
      # the tests link against the apt runtime libraries, so a new runner image rebuilds
      run: echo "value=gdal-$GDAL_VERSION-$ImageOS" >> $GITHUB_OUTPUT

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Cache GDAL
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/gdal
        key: ${{ steps.key.outputs.value }}

    - name: Build GDAL with the Java bindings
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y cmake g++ swig ant $GDAL_APT_PACKAGES
        wget --no-verbose --tries=5 --waitretry=15 --retry-connrefused -O gdal.tar.gz \
             "https://github.com/OSGeo/gdal/releases/download/v$GDAL_VERSION/gdal-$GDAL_VERSION.tar.gz"
        tar xf gdal.tar.gz
        cmake -S "gdal-$GDAL_VERSION" -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$HOME/gdal" \
          -DBUILD_JAVA_BINDINGS=ON \
          -DBUILD_PYTHON_BINDINGS=OFF \
          -DBUILD_CSHARP_BINDINGS=OFF \
          -DBUILD_TESTING=OFF
        cmake --build build -j"$(nproc)"
        cmake --install build

  build:
    runs-on: ubuntu-latest
    needs: gdal

    strategy:
      matrix:
        java-version: ['17', '21', '25']
      fail-fast: false

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'zulu'
        cache: maven

    - name: Validate source code and pom formatting
      run: mvn verify -Dspotless.action=check -Dpom.fmt.action=verify -Dall -DskipTests -ntp

    - name: Restore GDAL
      uses: actions/cache/restore@v4
      with:
        path: ~/gdal
        key: ${{ needs.gdal.outputs.cache-key }}
        fail-on-cache-miss: true

    - name: Set up GDAL
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y $GDAL_APT_PACKAGES
        # the JVM adds LD_LIBRARY_PATH to java.library.path, so the forked test JVMs
        # find libgdalalljni.so and the libgdal.so it links against
        echo "LD_LIBRARY_PATH=$HOME/gdal/lib/jni:$HOME/gdal/lib" >> $GITHUB_ENV
        echo "GDAL_DATA=$HOME/gdal/share/gdal" >> $GITHUB_ENV

    - name: Build and Test
      run: mvn -U clean install -T1C -Dall -Djava.awt.headless=true -DskipTests=false -ntp -fae

    # Without the native libraries the GDAL tests skip themselves and the build stays green
    # while testing nothing. VRT is a built-in driver, so a skip there means GDAL did not load.
    - name: Check the VRT tests ran
      if: always()
      run: |
        set -euo pipefail
        reports=plugin/gdal/gdalvrt/target/surefire-reports
        if [ ! -d "$reports" ]; then
          echo "The VRT tests did not run, there are no surefire reports in $reports"
          exit 1
        fi
        if grep -l -E 'skipped="[1-9]' "$reports"/*.xml; then
          echo "GDAL native libraries did not load, the VRT tests were skipped"
          exit 1
        fi
