name: Windows Build and Test

on:
  push:
    branches:
      - '**/*'
  pull_request:
    branches:
      - '**/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # GDAL 3.12 added the boolean, datetime and geometry raster attribute table
  # field types. Older versions keep the type code but drop the values, which
  # RasterAttributeTableTest checks, so this is the lowest version that works.
  GDAL_RELEASE: release-1944-x64-gdal-3-12-mapserver-8-6

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up GDAL
      run: |
        $url = "https://download.gisinternals.com/sdk/downloads/$env:GDAL_RELEASE.zip"
        $zip = Join-Path $env:RUNNER_TEMP "gdal.zip"
        $gdal = Join-Path $env:RUNNER_TEMP "gdal"
        Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 5 -RetryIntervalSec 15
        Expand-Archive -Path $zip -DestinationPath $gdal
        # gdalalljni.dll is found through PATH, which Java adds to java.library.path
        Add-Content $env:GITHUB_PATH "$gdal\bin"
        Add-Content $env:GITHUB_PATH "$gdal\bin\gdal\java"
        Add-Content $env:GITHUB_ENV "GDAL_DATA=$gdal\bin\gdal-data"
        Add-Content $env:GITHUB_ENV "GDAL_DRIVER_PATH=$gdal\bin\gdal\plugins"
        Add-Content $env:GITHUB_ENV "PROJ_LIB=$gdal\bin\proj9\share"

    # -Dall builds every module, like the Linux job. Modules whose native library
    # is missing on the runner still compile, their tests check for the driver and skip.
    - name: Build and Test
      run: |
        mvn -U clean install -T1C -Dall -Prelease "-Djava.awt.headless=true" "-DskipTests=false" -ntp -fae 2>&1 |
          Tee-Object -FilePath build.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Without the native libraries the GDAL tests skip themselves and the build stays
    # green while testing nothing, so treat a failed load as a build failure.
    - name: Check the GDAL native libraries were loaded
      if: always()
      run: |
        if (Test-Path build.log) {
          $failed = Select-String -Path build.log -Pattern 'GDAL Library is not Available','Failed to load the GDAL native libs'
          if ($failed) {
            $failed | Select-Object -First 5 | ForEach-Object { $_.Line }
            throw "GDAL native libraries did not load, the GDAL tests did not run"
          }
          Write-Host "GDAL native libraries loaded"
        }
